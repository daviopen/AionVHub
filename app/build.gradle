plugins { id 'com.android.application' }

android {
    namespace 'com.aionvhub.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.aionvhub.app'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.5.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('AION_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('AION_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AION_KEY_ALIAS')
                keyPassword System.getenv('AION_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    implementation 'androidx.media:media:1.7.0'
}
