name: Build iOS

on:
  push:
    branches:
      - main
      - feature/ios-aionvhub
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project AionVHub.xcodeproj \
            -scheme AionVHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AionVHub.app"
          test -d "$APP_PATH"
          rm -rf Payload AionVHub-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AionVHub-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AionVHub-iOS-unsigned
          path: ios/AionVHub-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AionVHub-iOS-build-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
